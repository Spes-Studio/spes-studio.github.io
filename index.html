<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spes Studio</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e8ec;
  }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  .tag { color: #9aa3af; margin: 0 0 2.5rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
       color: #9aa3af; margin: 0 0 .75rem; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .9rem 0; border-top: 1px solid #23262d; }
  a { color: #8ab4f8; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .desc { color: #9aa3af; font-size: .9rem; }
  footer { margin-top: 3rem; color: #6b7280; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Spes Studio</h1>
  <p class="tag">Bağımsız oyun ve uygulama geliştirme.</p>

  <h2>Uygulamalar</h2>
  <ul>
    <li>
      <a href="https://play.google.com/store/apps/details?id=com.spesstudio.diceapp">Dice</a>
      <div class="desc">Masaüstü rol yapma oyunları için zar atma aracı — d4'ten d20'ye tam set.</div>
    </li>
  </ul>

  <footer>© Spes Studio</footer>
</main>
</body>
</html>
